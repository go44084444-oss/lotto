[project]
name = "lotto-api"
version = "0.1.0"
description = "로또 조합 배분 API 서버"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "apscheduler>=3.10",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false
